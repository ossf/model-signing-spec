name: 'model-signing conformance'
description: >
  Run model-signing conformance tests against a language client adapter.
  Reports pass/fail counts per test category and uploads a JSON artifact.

inputs:
  entrypoint:
    description: >
      Path to the conformance adapter binary or script.
      The adapter must implement the sign-model and verify-model subcommands
      as described in the conformance protocol (see README.md).
    required: true

  skip-signing:
    description: >
      Set to 'true' to skip sign+verify round-trip tests.
      Verify-only tests (pre-committed bundles) still run.
    default: 'false'

  xfail:
    description: >
      Newline- or comma-separated list of test IDs to mark as expected failures.
      Tests matching these IDs will be counted as 'xfailed' rather than 'failed'.
      Example:
        xfail: |
          test_roundtrip[certificate-simple]
          test_verify[historical/historical-v0.2.0-certificate]
    default: ''

  skip-sigstore:
    description: >
      Set to 'true' to skip sigstore tests (for offline environments or
      adapters that do not implement sigstore signing/verification).
    default: 'false'

  sigstore-identity:
    description: >
      Expected certificate identity (SAN) for sigstore verification.
      Defaults to the Sigstore conformance testing service account.
    default: 'untrusted-sa@sigstore-conformance.iam.gserviceaccount.com'

  sigstore-issuer:
    description: >
      Expected OIDC issuer URL for sigstore verification.
    default: 'https://accounts.google.com'

  skip-result-upload:
    description: >
      Set to 'true' to skip uploading the conformance-report.json artifact.
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install conformance suite dependencies
      shell: bash
      run: |
        pip install -q "${{ github.action_path }}/.."
        pip install -q -r "${{ github.action_path }}/requirements.txt"

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install oras
      uses: oras-project/setup-oras@5c0b487ce3fe0ce3ab0d034e63669e426e294e4d # v1.2.2

    - name: Download and verify test fixtures
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="${{ github.action_path }}/config"
        VERIFY_DIR="${{ github.action_path }}/test/test-cases/verify"

        if [ -f "${VERIFY_DIR}/.fixtures-downloaded" ]; then
          echo "Fixtures already downloaded -- skipping"
          exit 0
        fi

        pip install -q pyyaml
        FIXTURES=$(python3 -c "
        import yaml
        f = yaml.safe_load(open('${CONFIG_DIR}/fixtures.yaml'))
        c = f.get('cosign', {})
        print(f['image'], f['digest'], c.get('certificate_identity',''), c.get('certificate_oidc_issuer',''))
        ")
        read -r IMAGE DIGEST IDENTITY ISSUER <<< "$FIXTURES"
        IMAGE_REF="${IMAGE}@${DIGEST}"

        echo "Verifying cosign signature for ${IMAGE_REF}..."
        cosign verify \
          --certificate-identity "${IDENTITY}" \
          --certificate-oidc-issuer "${ISSUER}" \
          "${IMAGE_REF}"

        echo "Pulling fixtures..."
        oras pull "${IMAGE_REF}" --output /tmp/conformance-fixtures
        tar xzf /tmp/conformance-fixtures/*.tar.gz -C "${VERIFY_DIR}/"
        rm -rf /tmp/conformance-fixtures

        echo "Fixtures extracted:"
        find "${VERIFY_DIR}" -name bundle.sig | wc -l

    - name: Fetch OIDC token for sigstore tests
      if: ${{ inputs.skip-sigstore != 'true' }}
      shell: bash
      run: curl --fail --retry 3 --output oidc-token.txt https://storage.googleapis.com/sigstore-conformance-testing-token/untrusted-testing-token.txt

    - name: Run conformance tests
      shell: bash
      run: python "${{ github.action_path }}/action.py"
      env:
        INPUT_ENTRYPOINT: ${{ inputs.entrypoint }}
        INPUT_SKIP_SIGNING: ${{ inputs.skip-signing }}
        INPUT_XFAIL: ${{ inputs.xfail }}
        INPUT_SKIP_SIGSTORE: ${{ inputs.skip-sigstore }}
        INPUT_SKIP_RESULT_UPLOAD: ${{ inputs.skip-result-upload }}
        SIGSTORE_ID_TOKEN_FILE: ./oidc-token.txt
        SIGSTORE_IDENTITY: ${{ inputs.sigstore-identity }}
        SIGSTORE_ISSUER: ${{ inputs.sigstore-issuer }}

    - name: Clean up OIDC token
      if: ${{ always() }}
      shell: bash
      run: rm -f oidc-token.txt

    - name: Upload conformance report
      if: ${{ always() && inputs.skip-result-upload != 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: conformance-report
        path: conformance-report.json
        if-no-files-found: warn
